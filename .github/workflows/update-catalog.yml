name: Update catalog

on:
  schedule:
    - cron: "0 19 * * *"   # daily at 04:00 Japan time
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Detail pages already seen are cached between runs, so only new cars are fetched.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: goonet-cache-${{ github.run_id }}
          restore-keys: goonet-cache-

      # Exits with an error if nothing was parsed -> deploy is skipped and the old site stays up.
      - run: python3 scraper/goonet.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
