<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Lion Motors — каталог</title>
<link rel="icon" href="../assets/lion.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F0; --surface: #FFFDF8; --surface-2: #F3EEE3; --line: #E8E2D4;
    --text: #141414; --muted: #6B665C; --accent: #8C6A2C; --accent-soft: rgba(185,142,69,.13);
    --dark: #0B0B0C; --on-dark: #F2EDE4; --on-dark-muted: #A8A296;
    --gold: #D9B46A; --gold-hi: #F3DFA2; --gold-lo: #B98E45;
    --gold-grad: linear-gradient(135deg, #F3DFA2 0%, #D9B46A 48%, #B98E45 100%);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button, select, input { -webkit-tap-highlight-color: transparent; font: inherit; }
  a { color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); }

  header { background: var(--dark); border-bottom: 1px solid rgba(217,180,106,.18); color: var(--on-dark); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 16px; flex-wrap: wrap; }
  .logo { font: 600 22px/1 Poppins, Inter, sans-serif; letter-spacing: .12em; margin: 0; }
  .logo a { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo b, .lock .logo { font-weight: inherit; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo .mark { height: 34px; width: auto; flex: none; }
  .meta { color: var(--on-dark-muted); font-size: 13px; }

  /* Filters */
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(250,247,240,.94);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  .bar .wrap { padding-top: 12px; padding-bottom: 10px; }
  .filters { display: grid; grid-template-columns: 2fr 1.4fr 1.4fr 1fr 1fr 1fr 1fr 1fr 1fr; gap: 8px; }
  .filters input, .filters select { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; font-size: 13.5px; outline: none; min-width: 0; }
  .filters input:focus, .filters select:focus { border-color: var(--gold-lo); }
  .subbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .subbar select { border: 0; background: transparent; padding: 4px 2px; font-weight: 600; color: var(--text); cursor: pointer; }
  .subbar .reset { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }
  .subbar > span { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #found, .subbar label { white-space: nowrap; }
  .ftoggle { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; padding: 18px 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; text-align: left; padding: 0; color: inherit; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.08); }
  .card:active { transform: scale(.985); }
  .ph { aspect-ratio: 4/3; background: var(--surface-2); position: relative; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; top: 10px; left: 10px; background: rgba(11,11,12,.72); color: var(--gold-hi);
    padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .card .body { padding: 12px 14px 14px; }
  .card h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .card .grade { color: var(--muted); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .card .price { margin-top: 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .price b { font-size: 19px; font-weight: 700; }
  .card .price small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .more { display: block; margin: 0 auto 48px; background: var(--dark); color: var(--gold-hi); border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 600; cursor: pointer; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; grid-column: 1/-1; }

  /* Detail */
  .detail { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; display: none; }
  .detail.open { display: block; }
  .detail .top { position: sticky; top: 0; background: rgba(250,247,240,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); z-index: 2; }
  .detail .top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
  .back { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; flex: none; }
  .dttl { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; padding: 24px 0 60px; }
  .stage { aspect-ratio: 4/3; background: var(--surface-2); border-radius: var(--radius); overflow: hidden; }
  .stage img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .info h2 { font: 600 28px/1.15 Poppins, Inter, sans-serif; margin: 0; letter-spacing: -.01em; }
  .info .grade { color: var(--muted); margin-top: 6px; }
  .info .price { font-size: 30px; font-weight: 700; margin: 18px 0 2px; }
  .info .price-note { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; border: 0; }
  .btn-gold { background: var(--gold-grad); color: var(--dark); }
  .btn-line { border: 1px solid var(--accent); color: var(--accent); background: transparent; }
  table { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 14px; }
  td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); width: 45%; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 14px; }

  footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding: 18px 0 30px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; }

  @media (max-width: 1100px) { .filters { grid-template-columns: repeat(4, 1fr); } .filters .q { grid-column: 1 / -1; } }
  @media (max-width: 900px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 640px) {
    .logo { font-size: 18px; } .logo .mark { height: 28px; }
    .meta { width: 100%; }
    .ftoggle { display: inline-flex; gap: 6px; align-items: center; background: var(--dark); color: var(--gold-hi); border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .filters { grid-template-columns: 1fr 1fr; display: none; margin-top: 8px; }
    .bar.open .filters { display: grid; }
    .filters .q { display: block; }
    .bar .search-mobile { display: block; }
    .grid { grid-template-columns: 1fr; gap: 14px; padding-top: 14px; }
    .ph { aspect-ratio: 16/10; }
    .dgrid.wrap { padding: 0; gap: 0; }
    .stage { border-radius: 0; }
    .info { padding: 16px 16px 0; }
    .info h2 { font-size: 24px; }
    .info .price { font-size: 26px; }
    .actions .btn { flex: 1; }
    footer .wrap { flex-direction: column; align-items: center; text-align: center; }
  }

  /* Password screen */
  body.locked > header, body.locked > .bar, body.locked > main, body.locked > footer { display: none; }
  .lock { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 24px 16px; background: var(--dark); color: var(--on-dark); }
  body.locked { background: var(--dark); }
  body.locked .lock { display: flex; }
  .lock form { width: 100%; max-width: 360px; text-align: center; }
  .lock .mark { display: block; height: 120px; width: auto; margin: 0 auto 22px; }
  .lock .logo { font-size: 30px; margin-bottom: 14px; }
  .lock p { color: var(--on-dark-muted); margin: 0 0 22px; font-size: 14px; }
  .lock input { width: 100%; background: #161618; border: 1px solid #2C2A26; color: var(--on-dark); border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; }
  .lock input:focus { border-color: var(--gold-lo); }
  .lock button[type=submit] { width: 100%; margin-top: 10px; background: var(--gold-grad); color: var(--dark); border: 0; border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer; }
  .lock button[disabled] { opacity: .6; cursor: wait; }
  .lock .lock-cancel { display: inline-block; margin-top: 14px; color: var(--on-dark-muted); font-size: 13px; }
  .lock .err { color: #F08A80; font-size: 13px; min-height: 20px; margin-top: 10px; }
</style>
</head>
<body class="locked">
<section class="lock" id="lock">
  <form id="lockForm" autocomplete="on" onsubmit="return false">
    <img class="mark" src="../assets/lion.svg" alt="">
    <h1 class="logo">LION MOTORS</h1>

    <input id="lockInput" type="password" autocomplete="current-password" placeholder="Пароль" required disabled>
    <button type="submit" id="lockBtn" disabled>Загрузка…</button>
    <a href="./" id="lockCancel" class="lock-cancel" hidden>Отмена</a>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</section>

<header>
  <div class="wrap">
    <h1 class="logo"><a href="../"><img class="mark" src="../assets/lion.svg" alt=""><b>LION MOTORS</b></a></h1>
    <div class="meta" id="meta"></div>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="filters" id="filters">
      <input class="q" id="f-q" type="search" placeholder="Поиск: марка, модель, комплектация">

        <select id="sort">
          <option value="new">Сначала новые</option>

</div>

<main class="wrap">
  <div class="grid" id="grid"></div>

</main>

<footer><div class="wrap"><span>Только леворульные автомобили из Японии. Цены в долларах — ориентир по текущему курсу, итог считается при заказе. <a href="../legal/tokushoho.html" style="color:inherit">特定商取引法に基づく表記</a> · <a href="../legal/privacy.html" style="color:inherit">Privacy</a></span><span><button class="linkbtn" id="adminBtn">Админ</button> · <button class="linkbtn" id="logout">Выйти</button></span></div></footer>

  <div class="top"><div class="wrap"><button class="back" id="back">← Все машины</button><span class="dttl" id="dttl"></span></div></div>
  <div class="wrap dgrid" id="dbody"></div>
</section>

<script src="../assets/company.js"></script>
<script>
// ---- Password gate: data.js holds AES-GCM blobs; keys come from PBKDF2-SHA256 (see scraper/seal.py).
const store = {
  get: (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del: (k) => { try { sessionStorage.removeItem(k); } catch (e) {} },
};
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(blob, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: unb64(blob.salt), iterations: blob.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function askPassword(blob, label, button) {
  const form = document.getElementById("lockForm"), input = document.getElementById("lockInput");
  const btn = document.getElementById("lockBtn"), err = document.getElementById("lockErr");
  document.getElementById("lockLabel").textContent = label;
  btn.textContent = button;
  input.disabled = false; btn.disabled = false;
  input.value = ""; err.textContent = "";
  document.body.classList.add("locked");
  input.focus();
  return new Promise((resolve) => {
    form.onsubmit = async (e) => {
      e.preventDefault();
      btn.disabled = true; err.textContent = "";
      try { resolve([await decrypt(blob, input.value), input.value]); }
      catch (x) { err.textContent = "Неверный пароль."; input.select(); }
      finally { btn.disabled = false; }
    };
  });
}

async function unlock(storeKey, blob, label, button) {
  const saved = store.get(storeKey);
  if (saved) { try { return await decrypt(blob, saved); } catch (e) { store.del(storeKey); } }
  const [data, pw] = await askPassword(blob, label, button);
  store.set(storeKey, pw);
  return data;
}

// Never keep a password in the address bar.
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has("password")) { q.delete("password"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); }
})();

(() => {
  const el = document.createElement("script");
  el.src = "data.js?v=" + Math.floor(Date.now() / 60000);
  el.onload = el.onerror = boot;
  document.head.appendChild(el);
})();

async function boot() {
  if (!window.CATALOG_ENC) {
    document.getElementById("lockLabel").textContent = "Каталог временно недоступен.";
    document.getElementById("lockForm").querySelectorAll("input,button").forEach((el) => (el.hidden = true));
    return;
  }
  const data = await unlock("catalog_pw", window.CATALOG_ENC, "Закрытый каталог. Введите пароль.", "Открыть каталог");
  const q = new URLSearchParams(location.search);
  if (q.get("admin") === "0") store.del("admin_pw");
  let sources = {};
  if (window.ADMIN_ENC && ((q.has("admin") && q.get("admin") !== "0") || store.get("admin_pw"))) {
    document.getElementById("lockCancel").hidden = false;
    sources = (await unlock("admin_pw", window.ADMIN_ENC, "Пароль администратора", "Включить режим админа")).sources;
    document.getElementById("lockCancel").hidden = true;
  }
  if (q.has("admin")) history.replaceState(null, "", location.pathname + location.hash);
  document.body.classList.remove("locked");
  startCatalog(data, sources);
}

function startCatalog(data, sources) {
  const $ = (id) => document.getElementById(id);
  const F = data.fields;
  const cars = data.cars.map((row) => Object.fromEntries(F.map((k, i) => [k, row[i]])));
  const rate = data.jpy_usd;
  const usd = (jpy) => jpy == null ? null : Math.round(jpy * rate / 100) * 100;
  const total = (c) => c.total_jpy ?? c.price_jpy;
  const fmt = (n) => n.toLocaleString("ru-RU");
  const money = (c) => { const v = usd(total(c)); return v == null ? "Цена по запросу" : "$" + fmt(v); };
  const yen = (n) => n == null ? "" : "¥" + fmt(n);
  const kmf = (n) => n == null ? "—" : fmt(n) + " км";
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const title = (c) => `${c.make} ${c.model}`.trim();
  cars.forEach((c) => (c._hay = `${c.make} ${c.model} ${c.grade}`.toLowerCase()));

  const upd = data.updated ? new Date(data.updated).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }) : "";
  $("meta").textContent = `${fmt(cars.length)} леворульных автомобилей · обновлено ${upd}`;

  // ---- filter options
  const countBy = (arr, key) => arr.reduce((m, c) => (c[key] && (m[c[key]] = (m[c[key]] || 0) + 1), m), {});
  const fillSel = (sel, counts, sortByCount) => {
    const keys = Object.keys(counts).sort(sortByCount ? (a, b) => counts[b] - counts[a] : (a, b) => a.localeCompare(b));
    sel.insertAdjacentHTML("beforeend", keys.map((k) => `<option value="${esc(k)}">${esc(k)} (${counts[k]})</option>`).join(""));
  };
  fillSel($("f-make"), countBy(cars, "make"), false);
  fillSel($("f-body"), countBy(cars, "body"), true);
  fillSel($("f-gear"), countBy(cars, "gearbox"), true);
  const years = [...new Set(cars.map((c) => c.year).filter(Boolean))].sort((a, b) => b - a);
  for (const id of ["f-yfrom", "f-yto"]) $(id).insertAdjacentHTML("beforeend", years.map((y) => `<option>${y}</option>`).join(""));
  $("f-price").insertAdjacentHTML("beforeend", [10000, 20000, 30000, 50000, 75000, 100000, 150000, 200000, 300000, 500000]
    .map((v) => `<option value="${v}">до $${fmt(v)}</option>`).join(""));
  $("f-km").insertAdjacentHTML("beforeend", [5000, 10000, 30000, 50000, 100000, 150000]
    .map((v) => `<option value="${v}">до ${fmt(v)} км</option>`).join(""));

  function refreshModels() {
    const sel = $("f-model"), mk = $("f-make").value;
    sel.innerHTML = '<option value="">Все модели</option>';
    sel.disabled = !mk;
    if (mk) fillSel(sel, countBy(cars.filter((c) => c.make === mk), "model"), false);
  }

  // ---- filtering, sorting, incremental rendering
  const PAGE = 48;
  let list = [], shown = 0;
  function apply() {
    const v = (id) => $(id).value;
    const q = v("f-q").trim().toLowerCase().split(/\s+/).filter(Boolean);
    const yf = +v("f-yfrom") || 0, yt = +v("f-yto") || 9999, pm = +v("f-price") || Infinity, km = +v("f-km") || Infinity;
    list = cars.filter((c) =>
      (!v("f-make") || c.make === v("f-make")) && (!v("f-model") || c.model === v("f-model")) &&
      (!v("f-body") || c.body === v("f-body")) && (!v("f-gear") || c.gearbox === v("f-gear")) &&
      (c.year || 0) >= yf && (c.year || 0) <= yt &&
      (pm === Infinity || (usd(total(c)) ?? Infinity) <= pm) && (km === Infinity || (c.km ?? Infinity) <= km) &&
      q.every((w) => c._hay.includes(w)));
    const s = v("sort"), P = (c) => total(c) ?? Infinity;
    if (s === "new") list.sort((a, b) => (b.year || 0) - (a.year || 0) || (a.km ?? 1e9) - (b.km ?? 1e9));
    if (s === "price-asc") list.sort((a, b) => P(a) - P(b));
    if (s === "price-desc") list.sort((a, b) => (total(b) ?? -1) - (total(a) ?? -1));
    if (s === "km") list.sort((a, b) => (a.km ?? 1e9) - (b.km ?? 1e9));
    $("found").textContent = `Найдено: ${fmt(list.length)}`;
    $("reset").hidden = !["f-q", "f-make", "f-model", "f-yfrom", "f-yto", "f-price", "f-km", "f-body", "f-gear"].some((id) => $(id).value);
    $("grid").innerHTML = list.length ? "" : '<div class="empty">Ничего не найдено. Попробуйте изменить фильтры.</div>';
    shown = 0; renderMore();
  }
  function card(c) {
    return `<button class="card" data-id="${esc(c.id)}">
      <div class="ph">${c.photo ? `<img src="${esc(c.photo)}" alt="${esc(title(c))}" loading="lazy" referrerpolicy="no-referrer">` : ""}${c.year ? `<span class="badge">${c.year}</span>` : ""}</div>
      <div class="body">
        <h3>${esc(title(c))}</h3>
        ${c.grade ? `<div class="grade">${esc(c.grade)}</div>` : ""}
        <div class="sub">${kmf(c.km)}${c.region ? " · " + esc(c.region) : ""}</div>
        <div class="price"><b>${money(c)}</b><small>${yen(total(c))}</small></div>
      </div></button>`;
  }
  function renderMore() {
    const next = list.slice(shown, shown + PAGE);
    $("grid").insertAdjacentHTML("beforeend", next.map(card).join(""));
    shown += next.length;
    $("more").hidden = shown >= list.length;
  }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && shown < list.length && renderMore()), { rootMargin: "800px" }).observe($("more"));
  }
  $("more").addEventListener("click", renderMore);
  let t;
  $("f-q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(apply, 200); });
  ["f-model", "f-yfrom", "f-yto", "f-price", "f-km", "f-body", "f-gear", "sort"].forEach((id) => $(id).addEventListener("change", apply));
  $("f-make").addEventListener("change", () => { refreshModels(); apply(); });
  $("reset").addEventListener("click", () => {
    ["f-q", "f-make", "f-yfrom", "f-yto", "f-price", "f-km", "f-body", "f-gear"].forEach((id) => ($(id).value = ""));
    refreshModels(); apply();
  });
  $("ftoggle").addEventListener("click", () => $("bar").classList.toggle("open"));
  $("grid").addEventListener("click", (e) => { const b = e.target.closest(".card"); if (b) location.hash = "car-" + b.dataset.id; });

  // ---- car page
  function openCar(id) {
    const c = cars.find((x) => x.id === id);
    if (!c) return closeCar();
    const rows = [
      ["Год", c.year], ["Пробег", kmf(c.km)], ["Кузов", c.body], ["Цвет", c.color],
      ["Двигатель", c.engine_cc ? (c.engine_cc / 1000).toFixed(1) + " л" : ""], ["Коробка", c.gearbox], ["Руль", "Левый"],
      ["Следы ДТП (修復歴)", c.accident], ["Гарантия продавца", c.warranty], ["Техобслуживание перед продажей", c.service],
      ["Японский техосмотр до", c.inspection], ["Где находится", c.region ? c.region + ", Япония" : "Япония"],
    ].filter(([, v]) => v !== "" && v != null);
    const W = window.COMPANY || {}, has = window.COMPANY_HAS || ((x) => !!x);
    const carUrl = location.origin + location.pathname + "#car-" + c.id;
    const msg = encodeURIComponent(`Здравствуйте! Интересует ${title(c)} ${c.year || ""}, ${money(c)}. ${carUrl}`);
    const order = has(W.whatsapp) ? `https://wa.me/${W.whatsapp}?text=${msg}` : "../#contact";
    $("dttl").textContent = title(c);
    $("dbody").innerHTML = `
      <div><div class="stage">${c.photo ? `<img src="${esc(c.photo)}" alt="${esc(title(c))}" referrerpolicy="no-referrer">` : ""}</div></div>
      <div class="info">
        <h2>${esc(title(c))}</h2>
        ${c.grade ? `<div class="grade">${esc(c.grade)}</div>` : ""}
        <div class="price">${money(c)}</div>
        <div class="price-note">${total(c) != null ? `Цена в Японии с налогами: ${yen(total(c))}${c.price_jpy && c.price_jpy !== total(c) ? ` (машина ${yen(c.price_jpy)})` : ""}. Доставка и растаможка считаются отдельно.` : "Продавец не указал цену — уточним по запросу."}</div>
        <div class="actions">
          <a class="btn btn-gold" href="${esc(order)}" target="_blank" rel="noopener">Заказать</a>
          ${sources[c.id] ? `<a class="btn btn-line" href="${esc(sources[c.id])}" target="_blank" rel="noopener noreferrer">Открыть на Carsensor ↗</a>` : ""}
        </div>
        <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
        <p class="note">Курс: 1 ¥ = $${rate}. Информация с японской площадки, перед покупкой мы проверяем машину и наличие.</p>
      </div>`;
    $("detail").classList.add("open"); $("detail").setAttribute("aria-hidden", "false"); $("detail").scrollTop = 0;
    document.body.style.overflow = "hidden";
  }
  function closeCar() { $("detail").classList.remove("open"); $("detail").setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
  const route = () => { const m = location.hash.match(/^#car-(.+)$/); m ? openCar(m[1]) : closeCar(); };
  $("back").addEventListener("click", () => (location.hash = ""));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("detail").classList.contains("open")) location.hash = ""; });
  window.addEventListener("hashchange", route);

  if (Object.keys(sources).length) $("adminBtn").textContent = "Админ ✓";
  $("adminBtn").addEventListener("click", () => { if (!Object.keys(sources).length) location.href = location.pathname + "?admin" + location.hash; });
  $("logout").addEventListener("click", () => { store.del("catalog_pw"); store.del("admin_pw"); location.hash = ""; location.reload(); });

  apply(); route();
}
</script>
</body>
</html>
